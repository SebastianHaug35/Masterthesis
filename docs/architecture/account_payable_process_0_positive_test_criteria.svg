<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="980" viewBox="0 0 1360 980" role="img" aria-labelledby="title desc">
  <title id="title">account_payable_process_0 system state changes</title>
  <desc id="desc">System-oriented visualization of required state changes in ERPNext, Mailpit, DMS, workflow database, and n8n for a positive test.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
      .section { font: 700 16px Arial, sans-serif; fill: #334155; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .system { font: 700 15px Arial, sans-serif; fill: #111827; }
      .muted { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .text { font: 400 13px Arial, sans-serif; fill: #1f2937; }
      .bold { font: 700 13px Arial, sans-serif; fill: #111827; }
      .mono { font: 400 11px "Courier New", monospace; fill: #1f2937; }
      .pre { fill: #eef6ff; stroke: #7db4e6; }
      .change { fill: #ecfdf5; stroke: #10b981; }
      .verify { fill: #fff7ed; stroke: #f59e0b; }
      .db { fill: #f5f3ff; stroke: #8b5cf6; }
      .pass { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .warn { fill: #fff1f2; stroke: #fb7185; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #94a3b8; stroke-width: 1.3; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 5; }
      .tag { fill: #f1f5f9; stroke: #cbd5e1; rx: 10; }
      .tagtext { font: 700 11px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 10px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="1360" height="980"/>
  <text x="58" y="54" class="title">Was muss sich in welchem System aendern?</text>
  <text x="58" y="80" class="subtitle">account_payable_process_0 als systemorientierter Positivtest: ERPNext, Email/Mailpit, DMS, Workflow-State-DB und n8n-Evaluation.</text>

  <rect x="58" y="108" width="1244" height="66" class="card pre"/>
  <text x="82" y="132" class="bold">Testinput / Korrelation</text>
  <text x="82" y="155" class="mono">case_id=AP-2026-0001   po_number=PO-4500012458   receiving_report_id=GR-2026-00441   invoice_number=INV-98451</text>

  <text x="58" y="212" class="section">Vor dem Workflow: deterministische Ausgangsdaten</text>

  <rect x="58" y="232" width="385" height="195" class="card pre"/>
  <text x="82" y="262" class="system">ERPNext</text>
  <text x="82" y="282" class="muted">System of record, Port 8076</text>
  <text x="82" y="312" class="text">Muss vorliegen:</text>
  <text x="102" y="338" class="mono">Company: Masterthesis Test GmbH</text>
  <text x="102" y="360" class="mono">Supplier: Meyer Industrietechnik GmbH</text>
  <text x="102" y="382" class="mono">Purchase Order: PO-4500012458 submitted</text>
  <text x="102" y="404" class="mono">Purchase Receipt: GR-2026-00441 submitted</text>

  <rect x="488" y="232" width="385" height="195" class="card pre"/>
  <text x="512" y="262" class="system">Email-System / Mailpit</text>
  <text x="512" y="282" class="muted">Lokaler Mailserver, API Port 8077</text>
  <text x="512" y="312" class="text">Muss vorliegen:</text>
  <text x="532" y="338" class="mono">Inbound invoice email exists</text>
  <text x="532" y="360" class="mono">From: vendor.billing@test.local</text>
  <text x="532" y="382" class="mono">To: invoice@test.local</text>
  <text x="532" y="404" class="mono">Invoice metadata: INV-98451, PO-4500012458</text>

  <rect x="918" y="232" width="385" height="195" class="card pre"/>
  <text x="942" y="262" class="system">n8n / Workflow Runtime</text>
  <text x="942" y="282" class="muted">Orchestrierung und Systemaufrufe</text>
  <text x="942" y="312" class="text">Muss erhalten:</text>
  <text x="962" y="338" class="mono">process_id=account_payable_process_0</text>
  <text x="962" y="360" class="mono">test_case_id=happy_path</text>
  <text x="962" y="382" class="mono">workflow input payload</text>
  <text x="962" y="404" class="mono">correlation keys fuer alle Systeme</text>

  <text x="58" y="482" class="section">Waehrend / nach dem Workflow: beobachtbare Systemeffekte</text>

  <rect x="58" y="502" width="300" height="235" class="card change"/>
  <text x="82" y="532" class="system">ERPNext muss sich aendern</text>
  <text x="82" y="558" class="text">Erwarteter fachlicher Effekt:</text>
  <text x="102" y="584" class="mono">Purchase Invoice exists or is created</text>
  <text x="102" y="606" class="mono">bill_no = INV-98451</text>
  <text x="102" y="628" class="mono">supplier = Meyer Industrietechnik GmbH</text>
  <text x="102" y="650" class="mono">references PO-4500012458</text>
  <text x="102" y="672" class="mono">references GR-2026-00441</text>
  <text x="102" y="694" class="mono">grand_total = 2915.50 EUR</text>
  <text x="82" y="718" class="tiny">Gespeichert in ERPNexts eigener MariaDB, nicht direkt durch den Test manipulieren.</text>

  <rect x="388" y="502" width="300" height="235" class="card change"/>
  <text x="412" y="532" class="system">Email/Mailpit muss sich aendern</text>
  <text x="412" y="558" class="text">Erwarteter Kommunikationseffekt:</text>
  <text x="432" y="584" class="mono">Result email exists</text>
  <text x="432" y="606" class="mono">To: accounting@test.local</text>
  <text x="432" y="628" class="mono">Subject contains AP-2026-0001</text>
  <text x="432" y="650" class="mono">Subject contains completed</text>
  <text x="432" y="672" class="mono">Body contains PO, GR, INV</text>
  <text x="432" y="694" class="mono">Body contains stamped</text>
  <text x="412" y="718" class="tiny">Mailpit ist Beobachtungs- und Testmailbox, kein externer Versand.</text>

  <rect x="718" y="502" width="285" height="235" class="card change"/>
  <text x="742" y="532" class="system">DMS / Dokumentenablage</text>
  <text x="742" y="558" class="text">Erwarteter Dokumenteffekt:</text>
  <text x="762" y="584" class="mono">PO document present</text>
  <text x="762" y="606" class="mono">Receipt document present</text>
  <text x="762" y="628" class="mono">Invoice document present</text>
  <text x="762" y="650" class="mono">all_documents_amended = true</text>
  <text x="762" y="672" class="mono">stamp_status = stamped</text>
  <text x="762" y="694" class="mono">archive_location created</text>
  <text x="742" y="718" class="tiny">Im Mock als DMS-State, in realer Variante als DMS/ERPNext-Anhang denkbar.</text>

  <rect x="1033" y="502" width="270" height="235" class="card db"/>
  <text x="1057" y="532" class="system">Separate Workflow-State-DB</text>
  <text x="1057" y="558" class="text">Sinnvoll fuer den Test:</text>
  <text x="1077" y="584" class="mono">workflow_case AP-2026-0001</text>
  <text x="1077" y="606" class="mono">status transitions</text>
  <text x="1077" y="628" class="mono">correlation IDs</text>
  <text x="1077" y="650" class="mono">validation results</text>
  <text x="1077" y="672" class="mono">audit log / evidence</text>
  <text x="1077" y="694" class="mono">runner report references</text>
  <text x="1057" y="718" class="tiny">Nicht ERP-Fachbestand, sondern Evaluations- und Orchestrierungszustand.</text>

  <path class="line" d="M 250 427 C 250 465 205 465 205 502"/>
  <path class="line" d="M 680 427 C 680 465 538 465 538 502"/>
  <path class="line" d="M 1110 427 C 1110 465 1168 465 1168 502"/>
  <path class="line-soft" d="M 1110 427 C 1010 470 888 470 860 502"/>

  <text x="58" y="790" class="section">Pass-Bedingung: alle Systemeffekte sind nachweisbar</text>

  <rect x="58" y="810" width="245" height="82" class="card verify"/>
  <text x="84" y="840" class="bold">ERPNext validiert</text>
  <text x="84" y="864" class="text">PO + Receipt + Invoice konsistent</text>

  <rect x="330" y="810" width="245" height="82" class="card verify"/>
  <text x="356" y="840" class="bold">Email validiert</text>
  <text x="356" y="864" class="text">Inbound invoice + result email vorhanden</text>

  <rect x="602" y="810" width="245" height="82" class="card verify"/>
  <text x="628" y="840" class="bold">DMS validiert</text>
  <text x="628" y="864" class="text">Komplett, gestempelt, archiviert</text>

  <rect x="874" y="810" width="245" height="82" class="card verify"/>
  <text x="900" y="840" class="bold">State-DB validiert</text>
  <text x="900" y="864" class="text">Case, Status und Audit belegbar</text>

  <rect x="1150" y="810" width="152" height="82" class="card pass"/>
  <text x="1190" y="842" class="bold">PASSED</text>
  <text x="1172" y="866" class="text">0 validation failures</text>

  <path class="line" d="M 303 851 L 330 851"/>
  <path class="line" d="M 575 851 L 602 851"/>
  <path class="line" d="M 847 851 L 874 851"/>
  <path class="line" d="M 1119 851 L 1150 851"/>

  <rect x="58" y="920" width="1244" height="38" class="card warn"/>
  <text x="82" y="944" class="bold">Architekturentscheidung:</text>
  <text x="236" y="944" class="text">ERPNext besitzt bereits eine eigene MariaDB. Eine extra DB ist sinnvoll fuer Workflow-Case-State, Korrelation, Audit und Evaluation, aber nicht fuer ERP-Stammdaten oder Buchungsobjekte.</text>
</svg>
